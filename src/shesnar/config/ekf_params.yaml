ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    # reset_on_time_jump: true

    frequency: 20.0
    sensor_timeout: 0.2

    two_d_mode: true
    publish_tf: true
    # Настройка систем координат (СК)
    map_frame: map               # СК игрового поля
    odom_frame: odom             # Относительная СК
    base_link_frame: base_link   # СК робота
    world_frame: map             # Абсолютная СК

    # Колесная одометрия (одомтерия относительно СК odom)
    odom0: /wheel_odom
    odom0_config: [true, true, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]

    odom0_differential: false  
    # odom0_relative: true       
    odom0_relative: false     
    odom0_queue_size: 2

    # Визуальная одометрия (одомтерия относительно СК map)
    odom1: /camera_odom
    odom1_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false  
    odom1_relative: false 
    odom1_queue_size: 2


    # pose1: /lidar_pose
    # pose1_config: [true, true, false,  
    #                 false, false, true,  
    #                 false, false, false,
    #                 false, false, false,
    #                 false, false, false]
    # pose1_differential: false
    # pose1_relative: false
    # pose1_queue_size: 1
    # pose1_delay: 0.001
    # pose1_rejection_threshold: 0.2
    # pose1_mahalanobis_threshold: 0.2


    print_diagnostics: true
    debug: false

    initial_state: [1.0, -0.3, 0.111,   # x, y, z
                    0.0, 0.0, 0.0,   # roll, pitch, yaw
                    0.0, 0.0, 0.0,   # vx, vy, vz
                    0.0, 0.0, 0.0,   # vroll, vpitch, vyaw
                    0.0, 0.0, 0.0]   # ax, ay, az